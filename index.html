<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>面孔联盟：3D肉鸽 (Face League: Micro-Rogue)</title>
<style>
  :root {
    --face-img: url('faces.png');
    --bg: #10121a;
    --card: #1a1d29;
    --accent: #3b82f6;
    --accent-gold: #f59e0b;
    --danger: #ef4444;
    --hp: #10b981;
    --border: #2d3348;
    --text: #f3f4f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 10px;
  }
  #app {
    background: var(--card);
    width: 100%;
    max-width: 440px;
    border-radius: 16px;
    border: 1px solid var(--border);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }

  /* 核心：把大图切成头像的基础样式 (11列 x 7行) */
  .face-sprite {
    background-image: var(--face-img);
    background-repeat: no-repeat;
    background-size: 1100% 700%;
    background-color: #ffffff;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }

  /* 顶部加载图片提示栏（未找到图片时手机可一键相册载入） */
  #img-bar {
    background: #252b3d;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.75rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px dashed var(--accent-gold);
  }
  #img-bar input { display: none; }
  .upload-btn {
    background: var(--accent-gold);
    color: #000;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
  }

  /* 顶栏状态 */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }
  .title { font-weight: 800; font-size: 1rem; }
  .stats { font-size: 0.8rem; display: flex; gap: 10px; }
  .stats b { color: var(--accent-gold); }

  /* 3人英雄出战栏 */
  .squad-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .hero-slot {
    background: #141622;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .hero-slot .face-sprite { width: 42px; height: 42px; }
  .hero-slot .name { font-size: 0.7rem; font-weight: 700; }
  .skill-btn {
    width: 100%;
    padding: 4px 0;
    font-size: 0.65rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .skill-btn:disabled { background: #2f354a; color: #6b7280; }

  /* 地牢棋盘 (6x6) */
  #board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 4px;
    background: #12141c;
    border-radius: 12px;
    padding: 6px;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--border);
  }
  .tile {
    background: #1c202e;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .tile.wall { background: #0f1017; }
  .tile.exit { background: #2a2210; box-shadow: inset 0 0 0 2px var(--accent-gold); }
  .tile.player-box { background: #1c2847; box-shadow: inset 0 0 0 2px var(--accent); }
  .tile .face-sprite { width: 85%; height: 85%; }
  .tile-badge {
    position: absolute;
    bottom: 2px;
    font-size: 0.65rem;
    font-weight: 800;
    background: rgba(0,0,0,0.85);
    color: var(--danger);
    padding: 0 4px;
    border-radius: 4px;
  }

  /* 状态信息条 */
  #log {
    height: 38px;
    background: #13151f;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.72rem;
    color: #9ca3af;
    overflow-y: auto;
    display: flex;
    flex-direction: column-reverse;
  }

  /* 触控轮盘 */
  .ctrl-pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    max-width: 190px;
    margin: 0 auto;
  }
  .ctrl-btn {
    background: #24293c;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .ctrl-btn:active { background: var(--accent); }

  /* 选人与结算全屏遮罩 */
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(12, 14, 21, 0.96);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
    gap: 12px;
    z-index: 99;
  }
  #overlay.hidden { display: none; }
  .roster-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    max-height: 280px;
    overflow-y: auto;
  }
  .roster-item {
    background: #191c28;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .roster-item.active { border-color: var(--accent-gold); background: #24283b; }
  .roster-item .face-sprite { width: 46px; height: 46px; }
  .start-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 24px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    width: 80%;
  }
</style>
</head>
<body>

<div id="app">
  <!-- 手机选图辅助条 -->
  <div id="img-bar">
    <span>原图未显示？点此加载本地截图：</span>
    <label class="upload-btn" for="local-file">选图</label>
    <input type="file" id="local-file" accept="image/*">
  </div>

  <header>
    <div class="title">面孔联盟 (Face League)</div>
    <div class="stats">
      <span>第 <b id="ui-floor">1</b> 层</span>
      <span>生命: <b id="ui-hp" style="color:var(--hp)">20/20</b></span>
    </div>
  </header>

  <!-- 3名角色状态栏 -->
  <div class="squad-bar" id="squad-bar"></div>

  <!-- 6x6 地下城 -->
  <div id="board"></div>

  <!-- 战况播报 -->
  <div id="log"></div>

  <!-- 手机虚拟摇杆 -->
  <div class="ctrl-pad">
    <div></div>
    <button class="ctrl-btn" onclick="game.move(0, -1)">▲</button>
    <div></div>
    <button class="ctrl-btn" onclick="game.move(-1, 0)">◀</button>
    <button class="ctrl-btn" onclick="game.move(0, 1)">▼</button>
    <button class="ctrl-btn" onclick="game.move(1, 0)">▶</button>
  </div>

  <!-- 选角与复活弹窗 -->
  <div id="overlay">
    <h3 id="modal-title">集结 3 位面孔英雄</h3>
    <div style="font-size:0.75rem; color:#9ca3af; text-align:center;">
      从图中特征人物中任选 3 名开启地牢探险：
    </div>
    <div class="roster-grid" id="roster"></div>
    <button class="start-btn" id="modal-btn" onclick="game.confirmSquad()">出征 (0/3)</button>
  </div>
</div>

<script>
// 精准映射原图坐标 (11 列 x 7 行, col: 0~10, row: 0~6)
const HEROES_META = [
  { id: 'chef', name: '主厨', col: 6, row: 0, skill: '盛宴回复', cd: 4, desc: '全队回复 6 点生命' },
  { id: 'cowboy', name: '西部牛仔', col: 1, row: 3, skill: '套索爆头', cd: 3, desc: '狙击距离最近敌人造成 4 伤' },
  { id: 'helmet', name: '橄榄球手', col: 5, row: 3, skill: '重装冲撞', cd: 4, desc: '震荡周围所有敌人造成 2 伤' },
  { id: 'agent', name: '墨镜特工', col: 2, row: 1, skill: '弱点洞察', cd: 4, desc: '下一次平砍产生 3 倍暴击' },
  { id: 'headphone', name: '电竞选手', col: 7, row: 3, skill: '超频律动', cd: 5, desc: '刷新其余所有队友技能冷却' },
  { id: 'beanie', name: '极地帽客', col: 9, row: 0, skill: '绝对零度', cd: 5, desc: '冰冻全场怪物 2 个回合' }
];

// 怪物同样取自大图中的其他面孔
const MONSTERS_META = [
  { name: '黄帽怪人', col: 10, row: 0, hp: 3, atk: 2 },
  { name: '红连帽极客', col: 5, row: 2, hp: 4, atk: 3 },
  { name: '黑超暴徒', col: 8, row: 1, hp: 5, atk: 4 }
];

function applySprite(el, col, row) {
  const x = (col / 10) * 100;
  const y = (row / 6) * 100;
  el.style.backgroundPosition = `${x}% ${y}%`;
}

class MicroRogue {
  constructor() {
    this.size = 6;
    this.floor = 1;
    this.hp = 20;
    this.maxHp = 20;
    this.selected = [];
    this.squad = [];
    this.pos = { x: 0, y: 0 };
    this.exit = { x: 5, y: 5 };
    this.enemies = [];
    this.walls = [];
    this.food = [];
    this.crit = false;
    this.freeze = 0;

    this.initFileUploader();
    this.buildRosterUI();
    window.addEventListener('keydown', (e) => this.handleKey(e));
  }

  initFileUploader() {
    const input = document.getElementById('local-file');
    input.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        document.documentElement.style.setProperty('--face-img', `url("${url}")`);
        document.getElementById('img-bar').style.display = 'none';
        this.log('已成功绑定本地面孔大图！');
      }
    });
  }

  buildRosterUI() {
    const roster = document.getElementById('roster');
    roster.innerHTML = '';
    HEROES_META.forEach(h => {
      const card = document.createElement('div');
      card.className = 'roster-item';
      
      const icon = document.createElement('div');
      icon.className = 'face-sprite';
      applySprite(icon, h.col, h.row);
      
      card.appendChild(icon);
      card.innerHTML += `
        <div class="name">${h.name}</div>
        <div style="font-size:0.6rem; color:#9ca3af; text-align:center;">${h.desc}</div>
      `;
      card.onclick = () => this.toggleHero(h, card);
      roster.appendChild(card);
    });
  }

  toggleHero(h, card) {
    const idx = this.selected.findIndex(x => x.id === h.id);
    if (idx >= 0) {
      this.selected.splice(idx, 1);
      card.classList.remove('active');
    } else if (this.selected.length < 3) {
      this.selected.push({ ...h, currentCd: 0 });
      card.classList.add('active');
    }
    const btn = document.getElementById('modal-btn');
    btn.innerText = `出征 (${this.selected.length}/3)`;
    btn.disabled = this.selected.length !== 3;
  }

  confirmSquad() {
    if (this.selected.length !== 3) return;
    this.squad = JSON.parse(JSON.stringify(this.selected));
    document.getElementById('overlay').classList.add('hidden');
    this.renderSquadBar();
    this.initFloor(1);
  }

  initFloor(floorNum) {
    this.floor = floorNum;
    document.getElementById('ui-floor').innerText = this.floor;
    this.pos = { x: 0, y: 0 };
    this.exit = { x: this.size - 1, y: this.size - 1 };
    this.walls = [];
    this.food = [];

    // 随机生成 4 块障碍墙
    while (this.walls.length < 4) {
      let wx = Math.floor(Math.random() * this.size);
      let wy = Math.floor(Math.random() * this.size);
      if ((wx === 0 && wy === 0) || (wx === this.exit.x && wy === this.exit.y)) continue;
      if (!this.walls.some(w => w.x === wx && w.y === wy)) this.walls.push({ x: wx, y: wy });
    }

    // 随机 1 个补给便当
    let fx = Math.floor(Math.random() * this.size);
    let fy = Math.floor(Math.random() * this.size);
    if (!this.isBlocked(fx, fy) && (fx !== 0 || fy !== 0)) this.food.push({ x: fx, y: fy });

    // 随机生成敌人
    this.enemies = [];
    const count = 2 + Math.floor(this.floor * 0.7);
    for (let i = 0; i < count; i++) {
      let ex, ey;
      do {
        ex = Math.floor(Math.random() * this.size);
        ey = Math.floor(Math.random() * this.size);
      } while (this.isBlocked(ex, ey) || (ex + ey < 2));

      const meta = MONSTERS_META[i % MONSTERS_META.length];
      this.enemies.push({
        ...meta,
        hp: meta.hp + (this.floor - 1) * 2,
        x: ex,
        y: ey
      });
    }

    this.log(`深入第 ${this.floor} 层，遭遇了异化面孔宿敌！`);
    this.render();
  }

  isBlocked(x, y) {
    if (x < 0 || y < 0 || x >= this.size || y >= this.size) return true;
    return this.walls.some(w => w.x === x && w.y === y);
  }

  handleKey(e) {
    if (this.hp <= 0) return;
    if (['ArrowUp', 'KeyW'].includes(e.code)) this.move(0, -1);
    if (['ArrowDown', 'KeyS'].includes(e.code)) this.move(0, 1);
    if (['ArrowLeft', 'KeyA'].includes(e.code)) this.move(-1, 0);
    if (['ArrowRight', 'KeyD'].includes(e.code)) this.move(1, 0);
  }

  move(dx, dy) {
    const nx = this.pos.x + dx;
    const ny = this.pos.y + dy;
    if (this.isBlocked(nx, ny)) return;

    // 撞击攻击怪物
    const targetIdx = this.enemies.findIndex(e => e.x === nx && e.y === ny);
    if (targetIdx >= 0) {
      let dmg = 2;
      if (this.crit) {
        dmg = 6;
        this.crit = false;
        this.log(`💥 墨镜破译暴击！造成 ${dmg} 点巨大创伤！`);
      } else {
        this.log(`⚔️ 小队撞击 ${this.enemies[targetIdx].name} 造成 ${dmg} 伤害。`);
      }
      this.enemies[targetIdx].hp -= dmg;
      if (this.enemies[targetIdx].hp <= 0) {
        this.log(`💀 击破 ${this.enemies[targetIdx].name}！`);
        this.enemies.splice(targetIdx, 1);
      }
      this.nextTurn();
      return;
    }

    this.pos = { x: nx, y: ny };

    // 拾取补给
    const fIdx = this.food.findIndex(f => f.x === nx && f.y === ny);
    if (fIdx >= 0) {
      this.hp = Math.min(this.maxHp, this.hp + 6);
      this.food.splice(fIdx, 1);
      this.log(`🍎 拾取应急能源，恢复 6 点 HP！`);
    }

    // 通关下潜
    if (this.pos.x === this.exit.x && this.pos.y === this.exit.y) {
      if (this.floor >= 5) {
        this.finishModal('🏆 突破成功！', '你带领面孔战队成功击穿了深渊！');
        return;
      }
      this.initFloor(this.floor + 1);
      return;
    }

    this.nextTurn();
  }

  nextTurn() {
    // 冷却结算
    this.squad.forEach(h => { if (h.currentCd > 0) h.currentCd--; });

    // 敌人行动
    if (this.freeze > 0) {
      this.freeze--;
      this.log(`❄️ 敌人处于冰冻状态，无法动弹！`);
    } else {
      this.enemies.forEach(e => {
        const d = Math.abs(e.x - this.pos.x) + Math.abs(e.y - this.pos.y);
        if (d === 1) {
          this.hp -= e.atk;
          this.log(`🩸 被 ${e.name} 攻击，承受 ${e.atk} 点伤害！`);
        } else if (d > 1) {
          let stepX = Math.sign(this.pos.x - e.x);
          let stepY = Math.sign(this.pos.y - e.y);
          if (stepX !== 0 && !this.isBlocked(e.x + stepX, e.y) && !this.enemies.some(m => m.x === e.x + stepX && m.y === e.y)) {
            e.x += stepX;
          } else if (stepY !== 0 && !this.isBlocked(e.x, e.y + stepY) && !this.enemies.some(m => m.x === e.x && m.y === e.y)) {
            e.y += stepY;
          }
        }
      });
    }

    if (this.hp <= 0) {
      this.hp = 0;
      this.render();
      this.finishModal('💀 小队倒下', `止步于第 ${this.floor} 层。肉鸽的核心在于重整旗鼓！`);
      return;
    }

    this.render();
  }

  useSkill(idx) {
    const h = this.squad[idx];
    if (h.currentCd > 0) return;

    if (h.id === 'chef') {
      this.hp = Math.min(this.maxHp, this.hp + 6);
      this.log(`👨‍🍳 主厨开启盛宴，恢复 6 HP！`);
    } else if (h.id === 'cowboy') {
      if (this.enemies.length === 0) return;
      let target = this.enemies[0];
      target.hp -= 4;
      this.log(`🤠 牛仔点杀！对 ${target.name} 造成 4 伤害！`);
      if (target.hp <= 0) this.enemies.splice(0, 1);
    } else if (h.id === 'helmet') {
      this.enemies.forEach(e => {
        if (Math.abs(e.x - this.pos.x) + Math.abs(e.y - this.pos.y) <= 2) {
          e.hp -= 2;
          this.log(`⛑️ 冲撞波及 ${e.name} (-2 HP)！`);
        }
      });
      this.enemies = this.enemies.filter(e => e.hp > 0);
    } else if (h.id === 'agent') {
      this.crit = true;
      this.log(`🕶️ 特工洞察破绽，下次平砍 300% 伤害！`);
    } else if (h.id === 'headphone') {
      this.squad.forEach((s, sidx) => { if (sidx !== idx) s.currentCd = 0; });
      this.log(`🎧 节奏超频，队友技能全部即刻重置！`);
    } else if (h.id === 'beanie') {
      this.freeze = 2;
      this.log(`🥶 冰霜冻结全场敌军 2 回合！`);
    }

    h.currentCd = h.cd;
    this.nextTurn();
  }

  log(msg) {
    const l = document.getElementById('log');
    const d = document.createElement('div');
    d.innerText = msg;
    l.prepend(d);
  }

  finishModal(title, sub) {
    const o = document.getElementById('overlay');
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-btn').innerText = '重开一局';
    document.getElementById('modal-btn').disabled = false;
    document.getElementById('modal-btn').onclick = () => location.reload();
    o.classList.remove('hidden');
  }

  renderSquadBar() {
    const bar = document.getElementById('squad-bar');
    bar.innerHTML = '';
    this.squad.forEach((h, i) => {
      const slot = document.createElement('div');
      slot.className = 'hero-slot';
      
      const img = document.createElement('div');
      img.className = 'face-sprite';
      applySprite(img, h.col, h.row);

      slot.appendChild(img);
      slot.innerHTML += `
        <div class="name">${h.name}</div>
        <button class="skill-btn" id="sbtn-${i}" onclick="game.useSkill(${i})">
          ${h.currentCd > 0 ? `CD: ${h.currentCd}` : h.skill}
        </button>
      `;
      bar.appendChild(slot);
    });
  }

  render() {
    document.getElementById('ui-hp').innerText = `${this.hp}/${this.maxHp}`;
    this.squad.forEach((h, i) => {
      const btn = document.getElementById(`sbtn-${i}`);
      if (btn) {
        btn.innerText = h.currentCd > 0 ? `CD: ${h.currentCd}` : h.skill;
        btn.disabled = h.currentCd > 0;
      }
    });

    const board = document.getElementById('board');
    board.innerHTML = '';

    for (let y = 0; y < this.size; y++) {
      for (let x = 0; x < this.size; x++) {
        const tile = document.createElement('div');
        tile.className = 'tile';

        if (x === this.pos.x && y === this.pos.y) {
          tile.classList.add('player-box');
          const face = document.createElement('div');
          face.className = 'face-sprite';
          // 棋盘上显示当前领队角色的 3D 脸庞
          applySprite(face, this.squad[0].col, this.squad[0].row);
          tile.appendChild(face);
        } else if (x === this.exit.x && y === this.exit.y) {
          tile.classList.add('exit');
          tile.innerText = '🚪';
        } else if (this.walls.some(w => w.x === x && w.y === y)) {
          tile.classList.add('wall');
          tile.innerText = '🧱';
        } else {
          const enemy = this.enemies.find(e => e.x === x && e.y === y);
          const food = this.food.find(f => f.x === x && f.y === y);

          if (enemy) {
            const eface = document.createElement('div');
            eface.className = 'face-sprite';
            applySprite(eface, enemy.col, enemy.row);
            tile.appendChild(eface);

            const badge = document.createElement('div');
            badge.className = 'tile-badge';
            badge.innerText = enemy.hp;
            tile.appendChild(badge);
          } else if (food) {
            tile.innerText = '🍎';
          }
        }

        // 点击相邻格子移动
        tile.onclick = () => {
          let dx = x - this.pos.x;
          let dy = y - this.pos.y;
          if (Math.abs(dx) + Math.abs(dy) === 1) this.move(dx, dy);
        };

        board.appendChild(tile);
      }
    }
  }
}

const game = new MicroRogue();
</script>
